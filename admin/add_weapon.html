<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/detail.css" />
    <link rel="stylesheet" href="../css/weapon_form.css" />
    <title>Severos - Add Weapon</title>
  </head>
  <body>
    <nav>
      <h2>Severos</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="weapon_list.html">Weapon</a></li>
      </ul>
      <ul>
        <li>Nathan</li>
        <li><a href="">Logout</a></li>
      </ul>
    </nav>
    <main>
      <a class="back" href="weapon_list.html">&larr; Back to Weapon List</a>
      <div class="weapon">
        <div class="weapon-desc">
          <input class="name-input" type="text" placeholder="Weapon Name" />

          <div class="field">
            <label for="weapon-type"><strong>Type:</strong></label>
            <select id="weapon-type" name="weapon-type">
              <option value="" selected>Select Type</option>
              <option value="handgun">Handgun</option>
              <option value="assault-rifle">Assault Rifle</option>
              <option value="machine-gun">Machine Gun</option>
              <option value="shotgun">Shotgun</option>
              <option value="submachine-gun">Submachine Gun</option>
              <option value="sniper-rifle">Sniper Rifle</option>
              <option value="grenade-launcher">Grenade Launcher</option>
              <option value="rocket-launcher">Rocket Launcher</option>
              <option value="railgun">Railgun</option>
              <option value="mortar">Mortar</option>
              <option value="flamethrower">Flamethrower</option>
              <option value="rifle">Rifle</option>
              <option value="antimatter-sniper-rifle">
                Antimatter Sniper Rifle
              </option>
            </select>
          </div>

          <div class="field">
            <label for="weapon-rarity"><strong>Rarity:</strong></label>
            <select id="weapon-rarity" name="weapon-rarity">
              <option value="" selected>Select Rarity</option>
              <option value="rare">RARE</option>
              <option value="epic">EPIC</option>
              <option value="legendary">LEGENDARY</option>
            </select>
          </div>
        </div>
        <div class="weapon-details">
          <div class="trait">
            <h3>Weapon Trait</h3>
            <textarea name="trait" rows="4"></textarea>
          </div>
          <div class="weapon-stats">
            <div class="stats">
              <h3>Weapon Stats</h3>
              <p>Damage: <input type="number" value="0" /></p>
              <p>Fire Rate: <input type="number" value="0" /></p>
              <p>Magazine Size: <input type="number" value="0" /></p>
              <p>Recoil: <input type="number" value="0" /></p>
            </div>
            <div class="sales">
              <h3>Weapon Sales</h3>
              <p>Sold: <span>0</span></p>
              <p>Stock: <input type="number" value="0" /></p>
              <p class="price">
                Price: <span>$</span> <input type="number" value="0" />
              </p>
            </div>
          </div>
          <button class="primary" type="button">Add Weapon</button>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Severos</p>
    </footer>
  </body>
</html>
